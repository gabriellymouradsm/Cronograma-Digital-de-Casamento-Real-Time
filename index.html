<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronograma Digital de Casamento Real-Time</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Cormorant Garamond & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['"Cormorant Garamond"', 'serif'],
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        wedding: {
                            50: '#FAF8F5',
                            100: '#F4EFEA',
                            200: '#E7DDD3',
                            300: '#D5C3B3',
                            400: '#BFA590',
                            500: '#AA8870',
                            600: '#8F6E57',
                            700: '#725542',
                            800: '#5A4335',
                            900: '#3D2D24',
                        },
                        rosegold: {
                            100: '#FDF1EE',
                            200: '#F8DED7',
                            500: '#C88A78',
                            600: '#B07160',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #FAF8F5;
            color: #3D2D24;
        }
        .font-cormorant {
            font-family: 'Cormorant Garamond', serif;
        }
        .animate-fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .progress-bar-fill {
            transition: width 0.5s ease-in-out;
        }
    </style>
</head>
<body class="min-h-screen pb-12 antialiased selection:bg-wedding-200 selection:text-wedding-900">

    <div class="max-w-md mx-auto px-4 py-6 sm:max-w-xl">
        <!-- Header -->
        <header class="text-center mb-6">
            <div class="inline-flex items-center justify-center space-x-2 mb-1">
                <span class="text-wedding-500 text-sm tracking-widest uppercase font-semibold">Cerimonial & Assessoria</span>
            </div>
            <h1 class="text-3xl sm:text-4xl font-cormorant font-bold text-wedding-900 tracking-tight">
                Cronograma do Casamento
            </h1>
            <p class="text-xs text-wedding-600 mt-1">Acompanhamento em tempo real do dia do evento</p>
        </header>

        <!-- Progress Indicator Card -->
        <section class="bg-white rounded-2xl p-5 shadow-sm border border-wedding-100 mb-6 transition-all duration-300 hover:shadow-md">
            <div class="flex items-center justify-between mb-3">
                <div>
                    <span class="text-xs font-semibold text-wedding-500 uppercase tracking-wider">Progresso do Evento</span>
                    <h2 id="progress-summary-text" class="text-lg font-bold text-wedding-800">0 de 0 concluídos</h2>
                </div>
                <div class="text-right">
                    <span id="progress-percentage-badge" class="inline-block px-3 py-1 rounded-full text-xs font-bold bg-wedding-100 text-wedding-800 transition-all duration-300">
                        0%
                    </span>
                </div>
            </div>
            <!-- Progress Bar Track -->
            <div class="w-full bg-wedding-100 rounded-full h-3 overflow-hidden p-0.5">
                <div id="progress-bar" class="progress-bar-fill bg-gradient-to-r from-wedding-400 to-wedding-600 h-2 rounded-full w-0"></div>
            </div>
        </section>

        <!-- Quick Cascade Delay Buttons (Efeito Impacto) -->
        <section class="bg-wedding-100/60 rounded-2xl p-4 border border-wedding-200/60 mb-6">
            <div class="flex items-center justify-between mb-2">
                <span class="text-xs font-bold text-wedding-700 uppercase tracking-wider flex items-center gap-1.5">
                    <svg class="w-4 h-4 text-wedding-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    Ajuste em Cascata (Atraso)
                </span>
                <span class="text-[10px] text-wedding-500">Aplica aos pendentes</span>
            </div>
            <div class="grid grid-cols-3 gap-2">
                <button onclick="applyDelay(5)" class="py-2 px-3 bg-white hover:bg-wedding-50 text-wedding-800 font-semibold text-xs rounded-xl shadow-sm border border-wedding-200 transition-all active:scale-95 flex items-center justify-center gap-1">
                    <span>+5 min</span>
                </button>
                <button onclick="applyDelay(15)" class="py-2 px-3 bg-white hover:bg-wedding-50 text-wedding-800 font-semibold text-xs rounded-xl shadow-sm border border-wedding-200 transition-all active:scale-95 flex items-center justify-center gap-1">
                    <span>+15 min</span>
                </button>
                <button onclick="applyDelay(30)" class="py-2 px-3 bg-white hover:bg-wedding-50 text-wedding-800 font-semibold text-xs rounded-xl shadow-sm border border-wedding-200 transition-all active:scale-95 flex items-center justify-center gap-1">
                    <span>+30 min</span>
                </button>
            </div>
        </section>

        <!-- Dynamic View Filters -->
        <section class="flex items-center justify-between bg-white rounded-xl p-1.5 border border-wedding-100 shadow-sm mb-5">
            <button id="filter-all" onclick="setFilter('all')" class="flex-1 py-1.5 px-3 rounded-lg text-xs font-medium transition-all text-wedding-900 bg-wedding-100 font-semibold">
                Ver Tudo
            </button>
            <button id="filter-pending" onclick="setFilter('pending')" class="flex-1 py-1.5 px-3 rounded-lg text-xs font-medium transition-all text-wedding-600 hover:text-wedding-900">
                Pendentes
            </button>
            <button id="filter-completed" onclick="setFilter('completed')" class="flex-1 py-1.5 px-3 rounded-lg text-xs font-medium transition-all text-wedding-600 hover:text-wedding-900">
                Concluídos
            </button>
        </section>

        <!-- Add Milestone Form Toggle / Container -->
        <section class="mb-6">
            <button id="toggle-add-form-btn" onclick="toggleAddForm()" class="w-full py-3 px-4 bg-wedding-800 hover:bg-wedding-900 text-white font-semibold text-xs rounded-xl shadow-sm transition-all flex items-center justify-center gap-2 active:scale-[0.99]">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                </svg>
                <span>Novo Marco</span>
            </button>

            <form id="add-milestone-form" onsubmit="handleAddMilestone(event)" class="hidden bg-white p-4 rounded-2xl border border-wedding-200 shadow-md mt-3 animate-fade-in space-y-3">
                <h3 class="text-sm font-bold text-wedding-800 border-b border-wedding-100 pb-2">Adicionar Novo Marco</h3>
                <div>
                    <label for="milestone-time" class="block text-xs font-medium text-wedding-700 mb-1">Horário</label>
                    <input type="time" id="milestone-time" required class="w-full px-3 py-2 text-sm border border-wedding-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-wedding-400 bg-wedding-50">
                </div>
                <div>
                    <label for="milestone-title" class="block text-xs font-medium text-wedding-700 mb-1">Descrição do Marco</label>
                    <input type="text" id="milestone-title" placeholder="Ex: Entrada dos Padrinhos" required class="w-full px-3 py-2 text-sm border border-wedding-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-wedding-400 bg-wedding-50">
                </div>
                <div class="flex items-center gap-2 pt-1">
                    <button type="submit" class="flex-1 py-2 bg-wedding-700 hover:bg-wedding-800 text-white text-xs font-semibold rounded-lg transition-all">
                        Salvar
                    </button>
                    <button type="button" onclick="toggleAddForm(false)" class="py-2 px-4 bg-wedding-100 hover:bg-wedding-200 text-wedding-800 text-xs font-semibold rounded-lg transition-all">
                        Cancelar
                    </button>
                </div>
            </form>
        </section>

        <!-- Milestones List -->
        <main id="milestones-container" class="space-y-3 min-h-[160px]">
            <!-- Rendered via app.js -->
        </main>

        <!-- Footer / Reset Option -->
        <footer class="mt-10 text-center border-t border-wedding-200/60 pt-6">
            <button onclick="resetToDefaults()" class="text-xs text-wedding-500 hover:text-wedding-700 underline transition-colors">
                Restaurar cronograma inicial de exemplo
            </button>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
