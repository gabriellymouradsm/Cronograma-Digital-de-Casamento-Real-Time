<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Front-End com Imagens</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #chat-container {
            width: 100%;
            max-width: 450px;
            height: 80vh;
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            background: #e4e6eb;
            padding: 10px 14px;
            border-radius: 18px;
            max-width: 75%;
            align-self: flex-start;
            word-wrap: break-word;
            font-size: 15px;
        }

        .message img {
            max-width: 100%;
            border-radius: 10px;
            margin-top: 5px;
            display: block;
        }

        #chat-input-area {
            display: flex;
            padding: 15px;
            background: #fff;
            border-top: 1px solid #ddd;
            gap: 10px;
            align-items: center;
        }

        #text-input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 20px;
            outline: none;
            font-size: 14px;
        }

        .file-label {
            background: #e4e6eb;
            padding: 10px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            font-size: 20px;
        }

        #file-input {
            display: none;
        }

        #send-btn {
            background: #0084ff;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        #send-btn:hover {
            background: #006bf2;
        }
    </style>
</head>
<body>

<div id="chat-container">
    <div id="chat-messages"></div>
    
    <div id="chat-input-area">
        <!-- Botão de Anexo de Imagem -->
        <label for="file-input" class="file-label">📷</label>
        <input type="file" id="file-input" accept="image/*">
        
        <!-- Campo de Texto -->
        <input type="text" id="text-input" placeholder="Digite uma mensagem...">
        
        <!-- Botão Enviar -->
        <button id="send-btn">Enviar</button>
    </div>
</div>

<script>
    const chatMessages = document.getElementById('chat-messages');
    const textInput = document.getElementById('text-input');
    const fileInput = document.getElementById('file-input');
    const sendBtn = document.getElementById('send-btn');

    // Função para renderizar a mensagem na tela
    function appendMessage(text, imageSrc) {
        const messageDiv = document.createElement('div');
        messageDiv.classList.add('message');

        if (text) {
            const textElement = document.createElement('p');
            textElement.textContent = text;
            messageDiv.appendChild(textElement);
        }

        if (imageSrc) {
            const imgElement = document.createElement('img');
            imgElement.src = imageSrc;
            messageDiv.appendChild(imgElement);
        }

        chatMessages.appendChild(messageDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight; // Rola o chat para baixo
    }

    // Função que processa o envio
    function handleSend() {
        const text = textInput.value.trim();
        const file = fileInput.files[0];

        if (!text && !file) return; // Não envia se estiver tudo vazio

        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                appendMessage(text, e.target.result);
            };
            reader.readAsDataURL(file);
        } else {
            appendMessage(text, null);
        }

        // Limpa os campos após o envio
        textInput.value = '';
        fileInput.value = '';
    }

    // Evento de clique no botão enviar
    sendBtn.addEventListener('click', handleSend);

    // Evento de apertar Enter no teclado
    textInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            handleSend();
        }
    });
</script>

</body>
</html>
